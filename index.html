<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Studio</title>
    <script>
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        var div = document.createElement('div');
        div.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#111;color:#ff5555;padding:20px;z-index:99999;font-family:monospace;white-space:pre-wrap;overflow:auto;';
        div.innerHTML = '<h1>Runtime Error</h1><h3>' + msg + '</h3><p>File: ' + url + ':' + lineNo + ':' + columnNo + '</p><pre>' + (error ? error.stack : '') + '</pre>';
        document.body.appendChild(div);
        return false;
      };
      window.onunhandledrejection = function(e) {
        var div = document.createElement('div');
        div.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#111;color:#ff5555;padding:20px;z-index:99999;font-family:monospace;white-space:pre-wrap;overflow:auto;';
        div.innerHTML = '<h1>Unhandled Rejection</h1><h3>' + e.reason + '</h3><pre>' + (e.reason ? e.reason.stack : '') + '</pre>';
        document.body.appendChild(div);
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
